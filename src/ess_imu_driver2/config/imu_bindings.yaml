# ============================================================
# IMU 名称 ↔ CH343 USB 序列号 绑定表
# ------------------------------------------------------------
# imu_auto_detect.py 启动时读取本文件:
#   - 设备 USB 序列号命中下方列表 -> 使用对应名称 (话题 /<name>/data 等)
#   - 未命中的多余设备            -> 命名 imu(x+1), x=下方绑定数量
#
# 查看序列号: ls /sys/class/tty/ttyACM*/device/../serial
# 修改后重启 imu_auto_launch 即可生效, 无需改代码
# ============================================================
imu_bindings:
  A1: "5C38170227"
  A2: "5C38170221"
  B1: "5C38170222"
  B2: "5C38170220"
